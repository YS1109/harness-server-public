name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service, client and backup tool in the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: harness-server:ci
          cache-from: type=gha,scope=harness-image-amd64
          cache-to: type=gha,mode=max,scope=harness-image-amd64
      - name: Container health, non-root volume and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          export HARNESS_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$HARNESS_TOKEN"
          trap 'docker rm -f harness-ci >/dev/null 2>&1 || true; docker volume rm harness-ci-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name harness-ci --env HARNESS_TOKEN \
            --publish 127.0.0.1:18080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount type=volume,source=harness-ci-data,target=/data harness-server:ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://127.0.0.1:18080/healthz
          docker exec harness-ci harness --url http://127.0.0.1:8080 health
          docker exec harness-ci harness-backup --version
          docker exec harness-ci harness --url http://127.0.0.1:8080 start \
            --agent ci --native-session-id docker-smoke --project demo --title 'Container smoke' >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/v1/executions \
            -H "Authorization: Bearer $HARNESS_TOKEN" -H 'Idempotency-Key: ci-execution' \
            -H 'Content-Type: application/json' \
            --data '{"task_id":"docker-smoke","conversation_id":"ci","source_key":"ci-message","project":"demo","title":"Container execution","goal":"Verify execution persistence"}' \
            | jq -e '.task.status == "QUEUED"'
          docker restart --time 30 harness-ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://127.0.0.1:18080/healthz
          docker exec harness-ci harness --url http://127.0.0.1:8080 list --kind session | jq -e '.total == 1'
          curl --fail --silent --show-error http://127.0.0.1:18080/v1/executions/docker-smoke \
            -H "Authorization: Bearer $HARNESS_TOKEN" | jq -e '.task.status == "QUEUED"'

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Compile Windows client
        run: cargo check --locked --bin harness
      - name: Verify Windows identity initialization
        run: cargo test --locked --test client initialization_persists_custom_or_generated_identity_without_credentials
